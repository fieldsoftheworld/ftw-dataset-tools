# Example config for the ftwd config-driven workflow.
#
# Run the full pipeline with:
#     ftwd run configs/examples/config.yaml
#
# Run or re-run individual stages with:
#     ftwd run configs/examples/config.yaml --only masks
#     ftwd run configs/examples/config.yaml --from select_images
#     ftwd run configs/examples/config.yaml --through stac
#
# Preview what would run without executing:
#     ftwd run configs/examples/config.yaml --dry-run
#
# A fully-resolved copy of this config (with all defaults filled in, plus the
# ftwd version and a timestamp) is written to the output directory as
# `ftwd-config.resolved.yaml` and embedded in the STAC catalog under `ftw:config`.

# Config schema version (optional; informational).
version: 1

# Path to the input GeoParquet field boundaries.
fields_file: austria_fields.parquet

# Output directory. If omitted, defaults to "{input_stem}-dataset".
output_dir: ./austria-dataset

# Dataset name used in output filenames. If omitted, defaults to the input stem.
name: austria

# Calendar year for temporal extent. Optional if the fields file has a
# determination_datetime column.
year: 2023

# If true, fail instead of auto-reprojecting non-EPSG:4326 input.
skip_reproject: false

# Publishable collection metadata. Optional, but without `license` the output is
# not Portolan-publishable (the stac stage warns). `providers` roles may be
# producer, licensor, processor; the publishing catalog adds the host.
# metadata:
#   title: Austria
#   description: Benchmark chips for Austria (edition 2025).
#   license: CC-BY-4.0          # SPDX id, or "other" plus license_url
#   version: 2.0.0-alpha.1
#   attribution: Agrarmarkt Austria  # recorded in the provenance; written to the README by the docs stage
#   keywords: [field-boundaries, benchmark, austria]
#   providers:
#     - {name: Agrarmarkt Austria, roles: [producer, licensor], url: https://example.org}
#     - {name: Fields of the World, roles: [processor], url: https://fieldsofthe.world}

stages:
  chips:
    # Minimum field-coverage percentage for a grid cell to be kept.
    min_coverage: 0.01
    # Drop chips on the outer border of the dataset (partial coverage).
    drop_border_chips: false

  splits:
    # One of: block3x3, predefined, random-uniform.
    split_type: random-uniform
    # Train / val / test percentages (must sum to 100).
    split_percents: [80, 10, 10]
    random_seed: 42

  masks:
    # Any subset of: instance, semantic_2_class, semantic_3_class.
    mask_types: [instance, semantic_2_class, semantic_3_class]
    # Pixel resolution in meters.
    resolution: 10.0
    # Parallel workers (null = half of CPUs).
    workers: null
    # Presence-only labels: background class value becomes 3 instead of 0.
    presence_only: false
    # Optional class filter: path (relative to THIS config file) to a YAML with
    # `column`, `include`, and `exclude`. Include classes count as field; all
    # others become background. Applied up front, so coverage, boundaries, and
    # masks all reflect the filter. Omit for datasets without crop-type info.
    # See configs/examples/class_filter.yaml.
    # class_filter: class_filter.yaml

  stac:
    # Compute file:checksum (multihash sha256) for every asset. Optional and slow
    # on large datasets, so off by default.
    checksums: false

  select_images:
    # Set to false to skip imagery selection entirely.
    enabled: true
    cloud_cover_chip: 2.0
    nodata_max: 0.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14

  download_images:
    # Disabled by default; imagery selection creates STAC references only.
    enabled: false
    bands: [red, green, blue, nir]
    resolution: 10.0
