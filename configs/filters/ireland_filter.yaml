# Class filter used for Ireland (IE) field boundaries. Keyed on crop:name (English), because the
# crop:code representation is inconsistent across editions (e.g. "124.0" in 2022/2024 vs "124" in
# 2023). Covers ie years 2022-2024; 167 distinct crop names. The HCAT group is shown as a comment.
#
# Excluded (background): permanent, extensively-grazed & low-input grassland, hay meadows, grass
# leys (Grass Year 1-5) and grass silage/grassmeal, reed canary grass; fallow; forestry, woodland,
# short-rotation coppice, willow, Miscanthus, scrub, foliage, tree belts, Christmas trees; orchards,
# fruit, berries & grapes; daffodils, cut-flower/bulb crops & nurseries; glasshouse crops; riparian
# & planted buffer zones, bird-food & wildlife-cover plots, designated habitats, bog, farmyards,
# roads, buildings, quarries, recreational & water areas and other non-crop/unknown land.
#
# Notable inclusions: cereals (barley, wheat, oats, rye, triticale), maize & sweetcorn; oilseed
# rape, forage rape, mustard, sunflower, linseed, flax, camelina, hemp; beans, peas, vetch, lupins,
# soya, protein/cereal mixes; clover, alfalfa/lucerne; fodder & sugar beet, potatoes and all field
# vegetables & roots; herbs; arable silage (non-grass) & mixed cropping; grass grown for seed; and
# strawberries.

