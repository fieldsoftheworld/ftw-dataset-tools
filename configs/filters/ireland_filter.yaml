# Class filter used for Ireland (IE) field boundaries. Codes are the crop:code from the
# harmonized ftw/harmonized-field-data ie dataset (numeric, stored as e.g. "124.0"); the English
# crop:name is shown as a comment. Covers ie year 2024 (the published edition); 152 codes.
#
# Excluded (background): permanent pasture, extensively grazed / low-input / peat grassland,
# hay meadows, multi-year grass leys (Grass Year 1-5), grass silage & grassmeal, reed canary
# grass; fallow; forestry, woodland, short-rotation coppice, willow, Miscanthus, scrub, foliage
# & tree belts; orchards, fruit, berries & grapes; daffodils, cut-flower/bulb crops & nurseries;
# glasshouse crops; riparian buffers/zones, bird-food & wildlife-cover plots, designated
# habitats, bog, farmyards, buildings, water and other non-crop/unknown areas.
#
# Notable inclusions: cereals (barley, wheat, oats, rye, triticale), maize & sweetcorn; oilseed
# rape, forage rape, mustard, sunflower, linseed, flax, camelina, hemp; beans, peas, vetch,
# lupins, protein/cereal mixes; clover, alfalfa/lucerne; fodder & sugar beet, potatoes and all
# field vegetables & roots; herbs; arable silage (non-grass) & mixed cropping; grass grown for
# seed; and strawberries.

