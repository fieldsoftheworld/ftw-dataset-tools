# Class filter used for Mecklenburg-Western Pomerania (de_mv) field boundaries.
# MV publishes only a coarse land-use crop:code with no crop names (13 categories). Codes are
# the crop:code from the harmonized ftw/harmonized-field-data de_mv dataset
# (code list: fiboa.org/code/de/de_mv.csv). This is a land-use-level filter, not a crop-type
# filter: only arable land (AF) is field; permanent grassland, orchards/permanent crops,
# afforestation, forest, riverside vegetation, special/Article-32 areas are background.
column: ["crop:code", "crop_code"]

include:
  - AF  # Ackerfläche (arable land)

exclude:
  - DGL     # Dauergrünland (permanent grassland)
  - DK      # Obstpl., Dauerkulturen (orchards, permanent crops)
  - AAF     # Aufforstung auf AF (afforestation on arable land)
  - AGL     # Aufforstung auf GL (afforestation on grassland)
  - AÖD     # Aufforstung auf ÖD (afforestation on wasteland)
  - FO      # Forstfläche (forest land)
  - SO      # Sondernutzung (not used / special use)
  - WA      # Wald (forest)
  - AF-AFS  # Ackerfläche - Agroforststreifen (agroforestry strip on arable)
  - 32A     # Article 32 arable land (1307/2013), non-productive eligible area
  - 32G     # Article 32 grassland (1307/2013)
  - 34G     # Article 34 grassland (73/2009)
