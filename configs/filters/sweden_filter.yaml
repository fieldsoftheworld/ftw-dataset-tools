# Class filter used for Sweden (SE) field boundaries. Codes are the Swedish Jordbruksverket
# grödkod (crop:code); the English HCAT name is shown as a comment. Covers se years 2015-2025;
# 103 distinct codes. Sweden is grassland-dominated, so much of the area is background.
#
# Excluded (background): all pasture, meadow & mowing/grazing grassland on arable and non-arable
# land, mountain & mosaic pasture, grass hay (forage dryer), forage ryegrass, energy grass, turf;
# fallow; forest grazing, energy willow (Salix) & poplar, Christmas trees; fruit, berries & nuts;
# nurseries; green manure; ornamental horticulture; and non-agricultural / biodiversity / admin
# areas (alvar, wetlands, protection zones, game fields, flowering-field margins, ineligible land,
# grass-poor land). Four codes (17, 26, 51, 69) are unmapped in the data and the Jordbruksverket
# code list and, per policy, are treated as background.
#
# Notable inclusions: all cereals (incl. mixed grain, green-fodder cereals, perennial wheat/rye),
# maize; oilseeds (rape, turnip rape, sunflower, mustard, oil radish, flax), hemp, tobacco;
# legumes & pulses and protein/cereal mixtures; potatoes, sugar & fodder beet; field vegetables,
# herbs, hops, chicory, kale, asparagus, rhubarb; green fodder; grass & clover grown for seed;
# strawberries; and other arable crops.

column: ["crop:code", "crop_code"]

include:
  - "1"  # Barley (autumn)
  - "2"  # Barley (spring)
  - "3"  # Oats
  - "4"  # Wheat (autumn)
  - "5"  # Wheat (spring)
  - "6"  # Mixtures of legumes or clover for roughage / silage
