# Class filter used for Finland (FI) field boundaries.
# Excluded classes are those that are not cultivated fields: grassland/pasture/meadow, forage grass, turf,
# reed canary grass, ornamentals, fallow (open/stump/uncultivated), protection zones/strips, environmental-
# agreement & natural-pasture areas, biodiversity/pollinator/green-cover & green-manure/soil-improvement
# plantings, greenhouse veg (melon), and administrative non-crop codes.
# Pure/forage grass and permanent grass are background.
# Notable inclusions: cereals (incl. green fodder), legumes (incl. clover/lucerne/galega/melilot leys),
# oilseeds, potatoes, beet, field vegetables, herbs/medicinal, flax, hemp, hops, strawberries, grass
# grown for seed, and permanent & tree crops: orchards, fruit trees, berries, grapevine, nurseries,
# ornamental willow and short-rotation energy wood/trees.
# Remediation/sanitation catch crops grown as a main crop (Saneerauskasvi: white mustard, oil
# radish, Tagetes, mixtures) are background, like the land-improvement mixture 5854. Annual and
# perennial hay/silage/pasture grass is background; grass grown for seed (61x3/61x5, 615x) is a
# field. Cut greens/conifers for decoration (5440/5441) and forest-tree nurseries (5534) count as
# permanent/tree crops, alongside ornamental willow and nurseries. Brown knapweed for energy
# (4930) is background, like reed canary grass for energy.
# Covers fi years 2020-2025 (246 distinct codes across those editions). Codes are the Finnish
# crop:code from the harmonized ftw/harmonized-field-data fi dataset; HCAT English names (or the
# Finnish crop:name) shown as comments.

