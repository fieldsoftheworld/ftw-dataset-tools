# Class filter used for Finland (FI) field boundaries.
# Excluded classes are those that are not open arable fields: grassland/pasture/meadow, forage grass, turf,
# reed canary grass, orchards, fruit & nut trees, berries, vineyards, ornamentals, nurseries, ornamental
# willow, energy trees/wood, fallow (open/stump/uncultivated), protection zones/strips, environmental-
# agreement & natural-pasture areas, biodiversity/pollinator/green-cover & green-manure/soil-improvement
# plantings, greenhouse veg (melon), and administrative non-crop codes.
# Pure/forage grass and permanent grass are background.
# Notable inclusions: cereals (incl. green fodder), legumes (incl. clover/lucerne/galega/melilot leys),
# oilseeds, potatoes, beet, field vegetables, herbs/medicinal, flax, hemp, hops, strawberries, and grass
# grown for seed. 
# Covers fi year 2023 (only year published). Codes are the Finnish crop:code from the harmonized
# ftw/harmonized-field-data fi dataset; HCAT English names shown as comments.

column: ["crop:code", "crop_code"]

