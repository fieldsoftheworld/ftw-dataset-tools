# Class filter used for Slovenia (SI) field boundaries.
# Codes are the Slovenian GERK crop code, shared by both harmonized editions: si (crop:code,
# years 2019-2024) and ec_si (crop_type_class, 2021, EuroCrops). English crop names shown as
# comments. 184 distinct codes; NULL codes are treated as background.
#
# Excluded (background): permanent grassland, grass leys on arable land, grass turf / green
# cover; fallow (incl. GAEC set-aside), cover crops, phacelia, niger and honey/pollinator
# mixtures; vineyards & vines for non-wine use; olive groves; orchards, fruit, berries & nuts;
# tree/vine nurseries, root-stock, short-rotation coppice, Miscanthus, ornamental plants & roses;
# hop-propagation nurseries; and non-agricultural / soilless / landscape / unknown areas.
# Grass grown for SEED (code 200) and clover-predominant clover-grass leys (206) are field, while
# grass-predominant grass-clover leys (203) and pure grass on arable (201) are background.
#
# Notable inclusions: all cereals, maize, sorghum, oilseeds (rape, sunflower, oil pumpkin, poppy,
# camelina, mustard, oil/fodder radish), hemp, flax, tobacco, soy, legumes & pulses, fodder
# legumes (clover, alfalfa, sainfoin, vetch, lupine, trefoil, grass pea, N-fixing mixes), fodder
# roots & brassicas, potatoes, sugar/fodder beet, all vegetables & herbs, medicinal/aromatic
# plants (lavender, echinacea), asparagus, artichoke, rhubarb, strawberries and hops.

