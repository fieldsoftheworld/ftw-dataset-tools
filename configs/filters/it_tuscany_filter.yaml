# Class filter used for Tuscany, Italy (it_1) field boundaries. Codes are the regional crop:code
# from the harmonized ftw/harmonized-field-data it_1 dataset; the English HCAT name is shown as a
# comment. Covers it_1 year 2023 (the published edition); 320 codes. Tuscany is dominated by
# olive groves, vineyards and woodland, so most parcels fall in the background class.
#
# Excluded (background): olive groves & olive nurseries, vineyards & vine nurseries; woodland,
# arboriculture, specialized tree crops, hedges, poplar/oak/eucalyptus/pine and other forest &
# ornamental trees; permanent & multifloral pasture/meadow, wooded pasture, forage grasses,
# ryegrass, fescue, bamboo, giant reed, turf; orchards, fruit trees, citrus, nuts, chestnuts &
# berries; ornamental flowers & plants, iris, lilies, roses, nurseries & greenhouses; shrubs,
# hawthorn, phacelia, Silphium, truffle & mushrooms; land withdrawn from production, field
# margins/edges, buffer strips, and non-agricultural areas.
#
# Notable inclusions: all cereals & pseudocereals, maize, sorghum, millet; oilseeds (sunflower,
# rape, mustard, flax, safflower, poppy, castor), hemp, tobacco, saffron; legumes & pulses,
# fodder legumes (alfalfa, clovers, sainfoin, vetches, trefoil, galega, lupin) & nitrogen-fixing
# mixes; potatoes, all field & horticultural vegetables; culinary/medicinal/aromatic herbs
# (lavender, rosemary, sage, thyme, helichrysum, chamomile, echinacea, ...); hops; family gardens;
# and strawberries.

