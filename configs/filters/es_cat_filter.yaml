# Class filter for the Catalonia dataset (es_cat). Cataluña uses its OWN numeric crop:code
# scheme (DUN), distinct from the national es scheme - the same number means different crops in
# each - so this filter is specific to es_cat. Crop names are Catalan (from crop:name_en).
# Covers es_cat year 2024 (the published edition); 210 codes.
#
# Excluded (background): olive groves, vineyards; all fruit trees, citrus, nuts and berries;
# forage grasses (agrostis, dactylis, fescue, ryegrass) and pastures; traditional & biodiversity
# fallow (guaret); short-rotation energy trees (poplar, willow, paulownia, eucalyptus) & osier;
# cut flowers, ornamental plants & nurseries (viver); and mushrooms & truffle.
#
# Notable inclusions: all cereals, maize, sorghum, sudan grass, rice; oilseeds (sunflower, rape,
# camelina, safflower, mustard); hemp, flax, hops, saffron; legumes & pulses; fodder legumes
# (alfalfa, sainfoin, clover, vetch, lupine, sulla, trefoil, crotalaria) and cereal/legume
# mixtures and forage mixtures; potatoes, beet; all vegetables; culinary/medicinal/aromatic herbs
# (incl. lavender, aloe, caper); and strawberries.

