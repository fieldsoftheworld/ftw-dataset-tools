# Class filter used for Belgium (Flanders) field boundaries.
# Excluded classes are those that are not considered agricultural fields, e.g. forest, ecological protection areas.
# Notable exclusions: grassland, pasture, meadows, orchards, fruit & nut trees, vineyards, grasses and
# grass/cover mixtures, flowers and ornamental plants, greenhouse / "protected cultivation", mushrooms,
# fallow / derelict land, and non-agricultural areas (buildings, water, infrastructure).
# Notable inclusions: cereals, maize, legumes, oilseeds, potatoes, sugar & fodder beet, field vegetables,
# medicinal plants/herbs, flax, hemp, hops, clover, alfalfa, strawberries.
# Covers crop codes across be_vlg years 2018-2025. Codes from EuroCrops be_vlg_2021.csv plus data-only additions:
# https://raw.githubusercontent.com/maja601/EuroCrops/refs/heads/main/csvs/country_mappings/be_vlg_2021.csv

