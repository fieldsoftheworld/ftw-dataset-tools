# Class filter for the Spain 2025 union (es_2025): Spain's national declarations plus the
# regional SIGPAC parcels that fill the national edition's gaps. The merged file is built by
# tools/merge_es_2025.py in the benchmark-data-catalog repository, which writes the ftw:class
# column this filter reads:
#
#   es:<crop code>            a national parcel. Field or background exactly as in
#                             spain_filter.yaml.
#   es:<62|63>:atlantic       national permanent or young pasture in Galicia, Asturias,
#                             Cantabria or País Vasco (provinces 15, 27, 32, 36, 33, 39, 01, 20,
#                             48): field. There, pasture parcels are hedge-bounded meadows; in
#                             the rest of Spain they are dehesa, rangeland, scrub and drove-road
#                             strips, so es:62 and es:63 stay background (2026-11 visual review,
#                             see docs/grassland-review.md).
#   <region>:<land use>       a regional SIGPAC parcel no national parcel covers (es_an, es_cb,
#                             es_cl, es_ga, es_pv). Field or background as in that region's
#                             filter: es_uso_filter.yaml for es_an and es_cl,
#                             es_uso_north_filter.yaml for es_cb, es_ga and es_pv.
#
# Generated from spain_filter.yaml, es_uso_filter.yaml and es_uso_north_filter.yaml; change those
# and regenerate rather than editing this list by hand.

column: ["ftw:class"]

