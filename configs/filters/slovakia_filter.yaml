# Class filter used for Slovakia (SK) field boundaries.
# Keyed on crop:name (the Slovak crop label); the sk dataset has no crop:code. English HCAT
# names are shown as comments. Covers sk years 2018-2026; 317 distinct crop names across those
# editions (names vary by year, e.g. "Pšenica ozimná" (2018-2022) vs "Pšenica letná ozimná";
# NULL crop:name is treated as background). The crop_group column groups parcels as
# arable land (Orná pôda), permanent grassland, vineyard, orchard/small fruit, permanent (woody)
# crops and hop gardens. The 2018-2023 editions also split permanent grassland into habitat
# types A-G, all background.
#
# Managed grassland (meadows, pastures, leys) is field since the 2026-11 visual review; rough,
# semi-natural, wooded, alpine and common grazing stays background. This supersedes any grassland
# exclusion described elsewhere in this header. See docs/grassland-review.md.
#
# Excluded (background): permanent grassland; and within arable land - fallow (incl. honey-plant
# fallow and "fallow with production"), biostrips, biodiversity islands, grassed-over and
# afforested arable land, grasses / herbaceous fodder, phacelia, buffer zones & linear landscape
# features, open and under-glass/foil ornamental flowers (incl. nasturtium), vegetables grown
# under glass/foil (greenhouse), the energy crop Sida hermaphrodita (Virginia mallow, as in
# de-bb-nds-nrw); and non-cropped vineyard handling areas.
#
# Notable inclusions: all cereals, maize (incl. silage/green/seed), sorghum, millet, buckwheat,
# oilseeds (rapeseed, sunflower, poppy, oilseed flax/radish, safflower, mustard), hemp, tobacco,
# soy, legumes & pulses, the generic 2018-2022 "mixed crop" (Zmiešaná plodina), fodder legumes
# (clover, lucerne, sainfoin, vetch, lupine, legume mixes), potatoes, sugar/fodder beet, all
# open-field vegetables (incl. melon/watermelon), medicinal & aromatic herbs, strawberries and
# hops; and permanent & tree crops: vineyards (incl. under restructuring and with flavescence
# dorée), orchards (incl. mixed landscape orchards), fruit, berries & nuts, woody nurseries,
# short-rotation woody crops (poplar, willow & other trees) and herbaceous permanent crops.

column: ["crop:name", "crop_name"]

