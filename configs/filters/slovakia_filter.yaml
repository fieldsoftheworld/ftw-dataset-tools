# Class filter used for Slovakia (SK) field boundaries.
# Keyed on crop:name (the Slovak crop label); the sk dataset has no crop:code. English HCAT
# names are shown as comments. Covers sk year 2026 (the only published edition); 217 distinct
# crop names (NULL crop:name is treated as background). The crop_group column groups parcels as
# arable land (Orná pôda), permanent grassland, vineyard, orchard/small fruit, permanent (woody)
# crops and hop gardens.
#
# Excluded (background): permanent grassland; and within arable land - fallow (incl. honey-plant
# fallow), biostrips, grassed-over arable land, grasses / herbaceous fodder, phacelia, buffer
# zones & linear landscape features, open and under-glass/foil ornamental flowers, and vegetables
# grown under glass/foil (greenhouse); vineyards; orchards, fruit, berries & nuts; and poplar,
# willow, forest trees, woody nurseries & other woody permanent crops.
#
# Notable inclusions: all cereals, maize (incl. silage/green/seed), sorghum, millet, buckwheat,
# oilseeds (rapeseed, sunflower, poppy, oilseed flax/radish, safflower, mustard), hemp, tobacco,
# soy, legumes & pulses, fodder legumes (clover, lucerne, sainfoin, vetch, lupine, legume mixes),
# potatoes, sugar/fodder beet, all open-field vegetables (incl. melon/watermelon), medicinal &
# aromatic herbs, strawberries and hops.

column: ["crop:name", "crop_name"]

