# Class filter used for the Spain national dataset (es). Codes are the national MAPA/FEGA
# "producto" crop:code; the English HCAT crop name is shown as a comment. Covers es year 2025
# (the published national edition); 385 codes. NOTE: this scheme is specific to the national es
# dataset - the Cataluña (es_cat), Canarias (es_cn) and coarse SIGPAC-uso regional datasets use
# different code schemes and have their own filters.
#
# Excluded (background): olive groves, vineyards & grapevine rootstocks; all fruit trees, citrus,
# subtropical fruit (avocado, mango, banana, pineapple, ...), berries, nuts and their
# associations; permanent & temporary pastures and forage/energy grasses (ryegrass, fescue,
# timothy, reed canary grass, Miscanthus); ryegrass-predominant leys; traditional/environmental/
# biodiversity fallow and permanent-crop headlands; forest & ornamental trees, nurseries,
# ornamental plants & flowers; truffle, mushrooms; tagasaste (tree lucerne); and unknown codes.
#
# Notable inclusions: all cereals & maize, sorghum, rice; oilseeds (sunflower, rape, camelina,
# safflower, poppy, sesame, mustard); cotton, hemp, flax, tobacco, hops, sugar cane, chufa,
# licorice; legumes & pulses; fodder legumes (alfalfa, sainfoin, clover, vetch, lupine, sulla,
# trefoil) and cereal/legume mixtures (incl. nitrogen-fixing-predominant meadow mixes); potatoes,
# sugar beet; all vegetables; culinary/medicinal/aromatic herbs (incl. lavender, saffron, aloe);
# and strawberries.

