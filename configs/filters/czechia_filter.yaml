# Class filter used for Czechia (CZ) field boundaries. Codes are the crop:code from the harmonized
# ftw/harmonized-field-data cz dataset; the English HCAT name (or Czech crop:name) is shown as a
# comment. Covers cz years 2019-2026 (union of all editions); 494 codes. This is an arable-crop
# declaration scheme (no orchard/vineyard codes).
#
# Excluded (background): temporary grassland, forage & meadow grasses (ryegrass, fescue, timothy,
# cocksfoot, bluegrass, bent, brome, Yorkshire fog, reed canary grass, ...) and grass-predominant
# grass-clover/grass-legume leys; poplar/willow/alder/ash short-rotation trees & forest planting
# material; Miscanthus, cup plant & grass-for-energy; phacelia, niger; fallow and the eco-scheme
# cover/strip mixtures (nectar & pollinator biobelts, catch crops, erosion/dividing/protective
# strips, headland & greening-lane mixes, species-rich & non-productive PVN mixes, improved non-
# market crops); hop-propagation seedlings; ornamental plants; landscape elements;
# and temporarily-ineligible / crop-less arable areas.
#
# Notable inclusions: all cereals (incl. spelt/emmer/einkorn), maize, sorghum, millet, buckwheat,
# quinoa, amaranth; oilseeds (rape, sunflower, poppy, flax, camelina, safflower, mustard, oilseed
# pumpkin), soy, hemp cultivars; legumes & pulses; fodder legumes (alfalfa, clovers, vetches,
# sainfoin, galega, lupines, trefoil) and legume/protein & cereal mixtures (incl. clover-/alfalfa-
# predominant leys); potatoes, sugar/fodder beet, all field vegetables & roots; culinary/medicinal/
# aromatic herbs; grasses grown for seed; Tagetes; and strawberries.

