# Class filter used for Czechia (CZ) field boundaries. Codes are the crop:code from the
# harmonized ftw/harmonized-field-data cz dataset; the English HCAT name (or the Czech crop:name
# where no English label exists) is shown as a comment. Covers cz year 2026 (the published
# edition); 335 codes. This is an arable-crop declaration scheme (no orchard/vineyard codes).
#
# Excluded (background): temporary grassland, forage & meadow grasses (ryegrass, fescue,
# timothy, bluegrass, bent, foxtail, cocksfoot, festulolium, reed canary grass, etc.) and
# grass-predominant grass-clover/grass-legume leys; poplar/willow/alder/ash short-rotation trees
# & forest planting material; Miscanthus, cup plant & grass-for-energy; phacelia, niger; fallow
# and the eco-scheme cover/strip mixtures (nectar & pollinator biobelts, catch crops, erosion &
# dividing & protective strips, headland & greening-lane mixes, species-rich & non-productive
# PVN mixes); hop-propagation seedlings; ornamental plants; landscape elements; and temporarily
# ineligible / crop-less arable areas.
#
# Notable inclusions: all cereals (incl. spelt, emmer, einkorn), maize (silage/grain/sweet/pop),
# sorghum, millet, buckwheat, quinoa; oilseeds (rape, sunflower, poppy, flax, camelina,
# safflower, mustard, oilseed pumpkin), soy, hemp cultivars; legumes & pulses; fodder legumes
# (alfalfa, clovers, vetches, sainfoin, galega, lupines, trefoil) and legume/protein & cereal
# mixtures (incl. clover-predominant clover-grass leys); potatoes, sugar/fodder beet, all field
# vegetables & roots; culinary/medicinal/aromatic herbs; grass grown for seed (canary seed);
# Tagetes; and strawberries.

