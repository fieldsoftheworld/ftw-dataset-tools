# Class filter used for Belgium (Wallonia) field boundaries.
# Excluded classes are those that are not considered agricultural fields, e.g. forest, ecological protection areas.
# Notable exclusions: grassland/meadow & fodder, fallow (jachere), orchards, fruit & nut trees, vineyards,
# ornamental plants & nurseries, greenhouse / "sous serre / sous verre", Christmas trees, short-rotation
# coppice & miscanthus, scrub/woodland, and non-agricultural parcels (buildings, water, sport/leisure).
# Notable inclusions: cereals, maize, legumes, oilseeds, potatoes, sugar & fodder beet, field vegetables,
# medicinal/aromatic plants, flax, hemp, hops, chicory, clover, alfalfa, sainfoin, strawberries.
# HCAT taxonomy and crop codes from be_wal.parquet (EuroCrops).

