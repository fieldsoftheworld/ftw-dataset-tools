# Class filter used for France (FR) field boundaries.
# Codes are the French RPG (Registre Parcellaire Graphique) 3-letter crop:code from the
# harmonized ftw/harmonized-field-data fr dataset; HCAT English names shown as comments.
# Covers fr years 2017 and 2019-2024 (2018 is not published). 314 distinct codes.
#
# Excluded (background): permanent & temporary grassland, pasture, meadow, ryegrass, pure
# forage grasses (fescue, dactylis, timothy, bromus), fallow/set-aside/EFA & temporarily
# unused agricultural land, orchards/fruit/berries/vineyards/nut trees/olive groves,
# greenhouse (off-ground) and open-field ornamental horticulture & ornamental flowers,
# biomass/energy crops (miscanthus, switchgrass, short-rotation coppice), nurseries, cover
# crops (phacelia, niger), nitrogen-fixing greening mixes, buffer/forest strips, field
# margins, agroforestry (grazed/pig-grazed groves, truffle oaks), reed beds/salt marsh,
# afforested land, pastoral rangeland, and administrative/unknown codes.
#
# Notable inclusions: cereals (incl. silage maize & forage cereals), oilseeds, protein crops
# & pulses, fibre hemp/flax, fodder legumes and legume-predominant leys (alfalfa, clover,
# sainfoin, vetch, lupine, melilot), fodder roots/brassicas (beet, carrot, cabbage, turnip),
# sugar beet, hops, mustard, tobacco, lavender & other aromatic/medicinal herbs, all field &
# market-garden vegetables, potatoes, strawberries, and (France-specific) open-field
# melon/watermelon and inter-row arable declarations.

