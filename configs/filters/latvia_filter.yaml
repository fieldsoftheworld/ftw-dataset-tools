# Class filter used for Latvia (LV) field boundaries.
# Codes are the Latvian crop:code from the harmonized ftw/harmonized-field-data datasets;
# English (or Latvian) crop labels shown as comments. Covers both LV editions that share the
# native Latvian code scheme: lv (2026) and ec_lv (2021, EuroCrops); 185 distinct codes.
#
# Excluded (background): permanent grassland and pure grass leys sown on arable land,
# grasses not elsewhere specified, phacelia (grown as cover / nectar / green manure),
# fallow & green-manure fallow, agricultural land ineligible for support, tree nurseries,
# energy trees & grasses (reed canary grass, switchgrass, willow, aspen, alder), orchards,
# fruit, berries, nuts, vineyards, shrubs, nectar-plant mixtures, perennial plantings, and
# semi-natural areas dominated by self-sown plants.
#
# Notable inclusions: all cereals (incl. hemp), oilseeds & mustard, flax, legumes & pulses,
# fodder legumes and legume-predominant leys (clover, alfalfa, galega, sainfoin, melilot,
# trefoil, crimson clover) and grasses grown for seed, maize (incl. biogas maize), potatoes,
# sugar/fodder beet, all field & market-garden vegetables, culinary/medicinal/aromatic herbs,
# strawberries, melon/watermelon, cultivated nectar/medicinal species, and sunflower.

