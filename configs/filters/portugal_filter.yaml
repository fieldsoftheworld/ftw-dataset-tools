# Class filter used for Portugal (PT) field boundaries.
# Codes are the Portuguese IFAP/iSIP crop:code from the harmonized ftw/harmonized-field-data pt
# dataset; labels (from the source code list https://fiboa.org/code/pt/pt.csv, else the HCAT
# English name) shown as comments. Covers pt years 2020-2023 and 2025 (2024 is not published);
# 261 distinct codes. crop:code has both zero-padded and unpadded variants of some codes; both
# are listed. There is no crop:name column.
#
# Excluded (background): permanent, temporary & natural pasture/meadow, forage grasses (ryegrass,
# Maralfalfa), greenhouse vegetables, fallow; oak montado (cork & holm oak), eucalyptus, forest,
# shrubs; orchards, fruit, berries, nuts, chestnuts, citrus, olive groves and vineyards;
# ornamental flowers & nurseries; and all non-agricultural / infrastructure / landscape features
# (roads, buildings, water lines, riparian galleries, headlands, hydroponic/soilless cultures).
# Unlabelled codes - the blank code, a single-space code, and source codes absent from the code
# list - are treated as background (no crop can be affirmed).
#
# Notable inclusions: cereals, maize & rice, oilseeds, cotton, hemp, flax, tobacco, sugar cane,
# groundnut, legumes & pulses, fodder legumes (clover, alfalfa, serradella, vetch), potatoes &
# roots, all open-field vegetables (incl. melon/watermelon), herbs, tea, strawberries, and
# annual forage / other temporary arable crops.

