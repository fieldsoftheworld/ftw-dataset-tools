# Class filter used for Netherlands (NL) field boundaries.
# Keyed on crop:name (the Dutch RVO gewas label), NOT crop:code: across the 2009-2026 editions
# the numeric crop:code was REUSED for different crops (e.g. code 1926 = seed potato in
# 2009-2011, then "agricultural nature mixture" from 2016), so codes are ambiguous while the
# Dutch crop:name is stable and unambiguous. Covers all editions 2009-2026; 580 distinct names.
#
# Excluded (background): permanent, temporary & natural grassland, pasture, forage grasses and
# turf (sod); fallow, green fallow, cover / green-manure crops (incl. phacelia, catch crops),
# field & fauna margins (randen); orchards, fruit, berries, nuts, vineyards; tree, hedge &
# ornamental nurseries, ornamental flowers & bulbs (tulip, lily, iris, dahlia, crocus, etc.),
# perennials, heather/Ericaceae, forest, Christmas trees; and energy crops (Miscanthus,
# Igniscum). Grass/clover grown for SEED is field; grass grown as forage/cover is background.
#
# Notable inclusions: all cereals & maize (incl. silage/energy maize), oilseeds, fibre flax &
# hemp, madder, legumes & pulses, fodder legumes (clover, alfalfa, sainfoin, trefoil), potatoes,
# sugar & fodder beet, all field & market-garden vegetables (incl. seed & propagation crops),
# culinary/medicinal/aromatic herbs, strawberries, Tagetes, and grass & clover seed crops.

