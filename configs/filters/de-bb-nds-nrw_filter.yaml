# Class filter used for German field boundaries in the states that publish the federal
# 3-digit Nutzungscode (NC): Brandenburg (de_bb), Niedersachsen (de_nds), and
# Nordrhein-Westfalen (de_nrw). Codes are the crop:code from the harmonized
# ftw/harmonized-field-data de_* datasets; German (or English) labels shown as comments.
# The other German states use coarser or different schemes and have their own filters:
# de_by, de_mv (crop:code, land-use only), de_sh (hbn), de_th (bnk).
# 325 distinct NC codes across bb (2026), nds (2025), nrw (2026).
#
# Excluded (background): landscape elements (hedges, tree rows, field copses, stone walls,
# margins) & eco-scheme strips, arable grass leys (Ackergras) and all grassland/pasture/
# meadow, fallow/set-aside/nature-conservation/buffer & erosion strips/afforestation,
# turf (Rollrasen) & ornamental plants, energy/biomass crops (Silphie, Miscanthus,
# switchgrass, reed canary grass), orchards/berries/nuts/vineyards/nurseries/agroforestry/
# heather/roses/truffle, Christmas trees, forest, storage heaps, and administrative codes.
# The empty crop:code ("") and non-agricultural areas are background.
#
# Notable inclusions: all cereals (incl. silage maize), legumes & pulses, oilseeds, fodder
# legumes and legume-predominant leys (clover, alfalfa, sainfoin, serradella, mixes),
# fodder roots, potatoes, sugar beet, all field & market-garden vegetables, culinary/
# medicinal/aromatic herbs, hemp, tobacco, poppy, strawberries, asparagus, rhubarb,
# artichoke, Tagetes, Sudan grass, seed-multiplication & trial plots, and mixed cultures.

