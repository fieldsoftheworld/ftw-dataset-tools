# Class filter used for Estonia (EE) field boundaries.
# Estonia has no national crop:code; the class column is the Estonian crop:name (text), so this filter
# lists crop NAMES. Excluded are classes that are not open arable fields: permanent grassland/pasture,
# pure/forage grass & grazing, orchards, fruit & nut trees, berries, vineyards, ornamentals & nurseries,
# greenhouse / protected veg, fallow, mushroom cultivation, willow, and grazing outside agricultural land.
# Notable inclusions: cereals, legumes (incl. clover/lucerne/melilot/trefoil/N-fixing forage leys),
# oilseeds, potatoes, beet, field vegetables, herbs/medicinal, flax, hemp, hops, strawberries, and named
# grass-seed varieties. Pure/forage grass and permanent grass are background.
# Covers ee years 2016-2024. Values are Estonian crop:name from the harmonized ftw/harmonized-field-data
# ee datasets; English HCAT names shown as comments where available.

column: ["crop:name", "crop_name"]

