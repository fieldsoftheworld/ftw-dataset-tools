# Class filter used for Estonia (EE) field boundaries.
# Keyed on crop:code (the zero-padded Estonian crop code; 1:1 with crop:name). The English HCAT
# name (or the Estonian crop:name) is shown as a comment. Covers ee years 2016-2024.
# Excluded are classes that are not open arable fields: permanent grassland/pasture, pure/forage
# grass & grazing, orchards, fruit & nut trees, berries, vineyards, ornamentals & nurseries,
# greenhouse / protected veg, fallow, mushroom cultivation, willow, and grazing outside
# agricultural land. Notable inclusions: cereals, legumes (incl. clover/lucerne/melilot/trefoil/
# N-fixing forage leys), oilseeds, potatoes, beet, field vegetables, herbs/medicinal, flax, hemp,
# hops, strawberries, and named grass-seed varieties. Pure/forage grass and permanent grass are
# background.

