# Class filter used for Switzerland (CH) field boundaries. Keyed on crop:name (German); the
# ch dataset has no crop:code. English HCAT names are shown as comments (where available).
# Covers ch year 2025 (the published edition); 150 distinct crop names. Switzerland is
# grassland-dominated, so most parcels fall in the background class.
#
# Excluded (background): all meadows & pastures (permanent, extensive, low-intensity, summering,
# riverside, hay, communal) and artificial grass leys (Kunstwiesen); vineyards; orchards, other
# perennial fruit & perennial berries, chestnut & mulberry groves, truffle plantations; forest,
# hedges/field/riparian shrubs, Christmas trees; nurseries (fruit, forest, vine, ornamental) &
# ornamental shrubs/perennials; greenhouse & protected cultivation (vegetables, berries, mushrooms,
# specialty crops); biodiversity-promotion areas, colourful & rotational fallow, field margins &
# beneficial-insect strips, litter meadows; perennial renewable-resource crops (Miscanthus);
# and unproductive / non-agricultural areas (built land, tracks, ditches, dry stone walls, etc.).
#
# Notable inclusions: all cereals (incl. spelt, emmer/einkorn, durum, mixed cereals, silage
# cereals), maize (silage/grain/seed), rice, sorghum, millet, buckwheat, quinoa; oilseeds (rape,
# sunflower, linseed, camelina, mustard, poppy, oil pumpkin, safflower - incl. as renewable
# resource), soy, hemp, tobacco, kenaf; legumes & pulses and legume/cereal mixtures; sugar &
# fodder beet, potatoes, asparagus, rhubarb, chicory roots, open-field & processing vegetables;
# grasses & forage legumes grown for seed; spice & medicinal plants; hops; home gardens;
# permaculture; and annual berries (strawberries).

column: ["crop:name", "crop_name"]

