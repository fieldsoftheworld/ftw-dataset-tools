# Class filter used for Switzerland (CH) field boundaries. Keyed on the federal LNF crop:code
# (Nutzungsflächen model 153.1), which every cantonal file (ch_ag ... ch_zh) carries; the cantons
# label the same code differently (German/French, abbreviated), so crop:name alone does not
# generalise. The original crop:name (German) entries are kept as a fallback for files without
# crop:code (the earlier national ch release). English HCAT names are shown as comments.
# Covers the 18 cantonal 2025 files ch_ag, ch_ai, ch_ar, ch_be, ch_bl, ch_fr, ch_ge, ch_ju, ch_lu,
# ch_sg, ch_sh, ch_so, ch_sz, ch_tg, ch_ur, ch_vs, ch_zg, ch_zh (153 codes). The code decisions
# were derived from the crop:name decisions (no code mixes field and background names); codes
# 399 (use to be determined), 891 (area abroad) and 929 (other QP elements) are background.
# Switzerland is grassland-dominated, so most parcels fall in the background class (alpine
# cantons AI, AR, SG, SZ, UR are below 10% field).
#
# Managed grassland (meadows, pastures, leys) is field since the 2026-11 visual review; rough,
# semi-natural, wooded, alpine and common grazing stays background. This supersedes any grassland
# exclusion described elsewhere in this header. See docs/grassland-review.md.
#
# Excluded (background): all meadows & pastures (permanent, extensive, low-intensity, summering,
# riverside, hay, communal) and artificial grass leys (Kunstwiesen); forest & wood pastures,
# hedges/field/riparian shrubs; annual & perennial open-field horticulture (flowers, turf);
# greenhouse & protected cultivation (vegetables, berries, mushrooms, specialty crops) and
# open-field mushrooms; biodiversity-promotion areas, colourful & rotational fallow, field margins &
# beneficial-insect strips, litter meadows; perennial renewable-resource crops (Miscanthus);
# and unproductive / non-agricultural areas (built land, tracks, ditches, dry stone walls, etc.).
#
# Notable inclusions: all cereals (incl. spelt, emmer/einkorn, durum, mixed cereals, silage
# cereals), maize (silage/grain/seed), rice, sorghum, millet, buckwheat, quinoa; oilseeds (rape,
# sunflower, linseed, camelina, mustard, poppy, oil pumpkin, safflower - incl. as renewable
# resource), soy, hemp, tobacco, kenaf; legumes & pulses and legume/cereal mixtures; sugar &
# fodder beet, potatoes, asparagus, rhubarb, chicory roots, open-field & processing vegetables;
# grasses & forage legumes grown for seed; spice & medicinal plants; hops; home gardens;
# permaculture; annual berries (strawberries); and permanent & tree crops: vineyards, orchards,
# other perennial fruit & perennial berries, chestnut & mulberry groves, truffle plantations,
# other permanent-crop areas, Christmas trees, nurseries (fruit, forest, vine, ornamental) and
# ornamental shrubs/woody plants.

